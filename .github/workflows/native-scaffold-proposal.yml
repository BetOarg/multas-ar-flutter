name: Generate native scaffold proposal

on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-proposal:
    name: Generate non-destructive Flutter scaffold proposal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate isolated native scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          mkdir -p "$RUNNER_TEMP/native-scaffold-proposal"
          cd "$RUNNER_TEMP/native-scaffold-proposal"
          flutter create \
            --platforms=android,ios \
            --org com.betOarg \
            --project-name multas_ar \
            scaffold_candidate
          cat > scaffold_candidate/RECOVERY_NOTES.md <<'EOF'
          # Native scaffold proposal — not merged into the application

          This directory was generated by the official Flutter stable CLI as a
          reference scaffold. It is intentionally isolated from the repository.

          Before copying files into the app, reconcile and validate:
          - Android namespace/applicationId: com.betOarg.multas_ar
          - Existing MainActivity.kt and OcrChannel.kt registration/lifecycle
          - Existing iOS AppDelegate.swift and OcrPlugin.swift registration
          - Required Android permissions, providers, manifest metadata and
            ONNX Runtime configuration
          - Gradle/AGP/Kotlin/Java/NDK compatibility with pubspec dependencies
          - iOS deployment target, plugin registration and Xcode build phases
          - Production signing configuration; never use debug signing for release

          Do not replace custom native files wholesale. This artifact is a
          comparison baseline, not a ready-to-merge implementation.
          EOF
          find scaffold_candidate/android scaffold_candidate/ios -maxdepth 4 -type f | sort > scaffold_candidate/NATIVE_FILE_INVENTORY.txt

      - name: Validate generated scaffold structure
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-scaffold-proposal/scaffold_candidate"
          missing=0
          for path in \
            "android/gradlew" \
            "android/gradlew.bat" \
            "android/gradle/wrapper/gradle-wrapper.properties" \
            "android/gradle/wrapper/gradle-wrapper.jar" \
            "ios/Runner.xcodeproj/project.pbxproj" \
            "RECOVERY_NOTES.md" \
            "NATIVE_FILE_INVENTORY.txt"; do
            if [ ! -f "$root/$path" ]; then
              echo "::error::Missing scaffold file: $path"
              missing=1
            fi
          done
          if [ ! -f "$root/android/settings.gradle" ] && [ ! -f "$root/android/settings.gradle.kts" ]; then
            echo "::error::Missing Android settings.gradle or settings.gradle.kts"
            missing=1
          fi
          # Newer Flutter stable templates use Swift Package Manager and may
          # not generate a Podfile. Accept either supported iOS dependency setup.
          if [ ! -f "$root/ios/Podfile" ] && [ ! -f "$root/ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift" ]; then
            echo "::error::Missing iOS dependency configuration (Podfile or generated Flutter SPM package)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Generated scaffold file inventory:"
            find "$root/android" "$root/ios" -maxdepth 5 -type f | sort || true
            exit 1
          fi
          echo "Generated scaffold structure is complete; integration into the app is not implied."

      - name: Upload scaffold proposal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scaffold-proposal
          path: ${{ runner.temp }}/native-scaffold-proposal/scaffold_candidate/
          if-no-files-found: error
          retention-days: 7
