name: Native scaffold integration smoke test

on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-integration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-scaffold-smoke:
    name: Test existing Android app against generated Flutter scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate isolated Flutter scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          mkdir -p "$RUNNER_TEMP/native-integration"
          cd "$RUNNER_TEMP/native-integration"
          flutter create \
            --platforms=android,ios \
            --org com.betOarg \
            --project-name multas_ar \
            candidate

      - name: Overlay app code into temporary scaffold
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/native-integration/candidate"
          cp "$GITHUB_WORKSPACE/pubspec.yaml" "$candidate/pubspec.yaml"
          rm -rf "$candidate/lib" "$candidate/test"
          cp -a "$GITHUB_WORKSPACE/lib" "$candidate/lib"
          # Do not let Flutter's generated example test refer to a non-existent
          # MyApp class; this workflow validates native integration, not tests.
          if [ -d "$GITHUB_WORKSPACE/test" ]; then
            cp -a "$GITHUB_WORKSPACE/test" "$candidate/test"
          fi
          if [ -f "$GITHUB_WORKSPACE/analysis_options.yaml" ]; then
            cp "$GITHUB_WORKSPACE/analysis_options.yaml" "$candidate/analysis_options.yaml"
          fi
          if [ -d "$GITHUB_WORKSPACE/assets" ]; then
            cp -a "$GITHUB_WORKSPACE/assets" "$candidate/assets"
          fi
          # The current Flutter template uses Kotlin DSL; remove that app-level
          # file so Gradle exercises the repository's actual Groovy build.gradle.
          rm -f "$candidate/android/app/build.gradle.kts"
          cp "$GITHUB_WORKSPACE/android/app/build.gradle" "$candidate/android/app/build.gradle"
          if [ -f "$GITHUB_WORKSPACE/android/app/proguard-rules.pro" ]; then
            cp "$GITHUB_WORKSPACE/android/app/proguard-rules.pro" "$candidate/android/app/proguard-rules.pro"
          fi
          # Preserve the app's manifest, Kotlin OCR channel and resources for the
          # test, while leaving the repository and its custom files untouched.
          cp -a "$GITHUB_WORKSPACE/android/app/src/main/." "$candidate/android/app/src/main/"
          {
            echo "Candidate: generated by Flutter stable CLI"
            echo "Application ID target: com.betOarg.multas_ar"
            echo "Repository commit: $GITHUB_SHA"
            echo "Existing custom Android sources overlaid only in runner temp."
            echo "No repository files were modified by this workflow."
          } | tee "$RUNNER_TEMP/native-integration/TEST_SCOPE.txt"

      - name: Fetch free PaddleOCR assets from pinned GitHub release
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/native-integration/candidate"
          mkdir -p "$candidate/assets/models" "$candidate/android/app/src/main/assets/models"
          fetch_verified() {
            local source="$1" target="$2" expected="$3"
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/gitakoos/ocr-models/releases/download/v1/$source" -o "$RUNNER_TEMP/$source"
            echo "$expected  $RUNNER_TEMP/$source" | shasum -a 256 -c -
            cp "$RUNNER_TEMP/$source" "$candidate/assets/models/$target"
            cp "$RUNNER_TEMP/$source" "$candidate/android/app/src/main/assets/models/$target"
          }
          fetch_verified det.onnx det.onnx d7fe3ea74652890722c0f4d02458b7261d9f5ae6c92904d05707c9eb155c7924
          fetch_verified cls.onnx cls.onnx f4bb53707100c5f3d59ba834eb05bb400369f20aed35d4b26807b1bfadd2a70e
          fetch_verified rec_latin.onnx rec.onnx 995b0f5f28d2073896a78c03b5b863eae6af3744bafa0245b8522beea6994927
          fetch_verified ppocrv5_latin_dict.txt ppocr_keys.txt ccbcc45730b3fbbd9050c5bc74db6a99067141ef1035e3d14889a84a6b9b1aff
          for name in LICENSE NOTICE; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/gitakoos/ocr-models/main/$name" \
              -o "$candidate/assets/models/$name"
            cp "$candidate/assets/models/$name" "$candidate/android/app/src/main/assets/models/$name"
          done
          du -h "$candidate/assets/models/"*

      - name: Resolve Flutter dependencies
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration/candidate
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/native-integration/pub-get.log"

      - name: Generate Drift sources
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration/candidate
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee "$RUNNER_TEMP/native-integration/build-runner.log"

      - name: Analyze overlaid application (diagnostic; does not block native build)
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration/candidate
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/native-integration/flutter-analyze.log"

      - name: Build Android debug APK against generated Gradle scaffold
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration/candidate
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/native-integration/android-debug-build.log"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integration-smoke-logs
          path: ${{ runner.temp }}/native-integration/*.log
          if-no-files-found: warn
          retention-days: 7


  ios-scaffold-smoke:
    name: Test existing iOS app against generated Flutter/Xcode scaffold
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate isolated Flutter iOS scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          mkdir -p "$RUNNER_TEMP/native-integration-ios"
          cd "$RUNNER_TEMP/native-integration-ios"
          flutter create \
            --platforms=ios \
            --org com.betOarg \
            --project-name multas_ar \
            candidate

      - name: Overlay Flutter app and custom iOS OCR integration
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/native-integration-ios/candidate"
          # Regenerate only the native scaffold first. Flutter's --overwrite
          # also replaces pubspec.yaml, so restore the app manifest immediately
          # afterward before resolving dependencies or generating Drift sources.
          (cd "$candidate" && flutter create --overwrite --platforms=ios --org com.betOarg --project-name multas_ar .)
          cp "$GITHUB_WORKSPACE/pubspec.yaml" "$candidate/pubspec.yaml"
          rm -rf "$candidate/lib"
          cp -a "$GITHUB_WORKSPACE/lib" "$candidate/lib"
          if [ -f "$GITHUB_WORKSPACE/analysis_options.yaml" ]; then
            cp "$GITHUB_WORKSPACE/analysis_options.yaml" "$candidate/analysis_options.yaml"
          fi
          if [ -d "$GITHUB_WORKSPACE/assets" ]; then
            cp -a "$GITHUB_WORKSPACE/assets" "$candidate/assets"
          fi
          # Keep the generated Xcode project and dependency setup; overlay only
          # app-owned Swift entry points and Info.plist for this isolated test.
          cp "$GITHUB_WORKSPACE/ios/Runner/AppDelegate.swift" "$candidate/ios/Runner/AppDelegate.swift"
          cp "$GITHUB_WORKSPACE/ios/Runner/OcrPlugin.swift" "$candidate/ios/Runner/OcrPlugin.swift"
          cp "$GITHUB_WORKSPACE/ios/Runner/Info.plist" "$candidate/ios/Runner/Info.plist"
          # The generated Xcode project does not know about an overlaid Swift
          # file. Combine the custom plugin into AppDelegate for this isolated
          # smoke test so Swift compiles the same source without editing pbxproj.
          python3 -c 'from pathlib import Path; p=Path("'"$candidate"'/ios/Runner/AppDelegate.swift"); lines=p.read_text().splitlines(); lines=[line for line in lines if line.strip() != "import Vision"]; lines.insert(2, "import Vision"); p.write_text("\n".join(lines)+"\n")'
          tail -n +5 "$candidate/ios/Runner/OcrPlugin.swift" >> "$candidate/ios/Runner/AppDelegate.swift"
          rm "$candidate/ios/Runner/OcrPlugin.swift"
          {
            echo "Candidate: generated by Flutter stable CLI on macOS"
            echo "Repository commit: $GITHUB_SHA"
            echo "Existing Swift OCR integration overlaid only in runner temp."
            echo "No repository files were modified by this workflow."
          } | tee "$RUNNER_TEMP/native-integration-ios/TEST_SCOPE.txt"

      - name: Resolve Flutter dependencies
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration-ios/candidate
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/native-integration-ios/pub-get.log"

      - name: Generate Drift sources
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration-ios/candidate
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee "$RUNNER_TEMP/native-integration-ios/build-runner.log"

      - name: Build iOS simulator app without signing
        shell: bash
        working-directory: ${{ runner.temp }}/native-integration-ios/candidate
        run: |
          set -o pipefail
          flutter build ios --simulator --no-codesign --no-pub 2>&1 | tee "$RUNNER_TEMP/native-integration-ios/ios-simulator-build.log"

      - name: Upload iOS diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integration-ios-smoke-logs
          path: ${{ runner.temp }}/native-integration-ios/*.log
          if-no-files-found: warn
          retention-days: 7
