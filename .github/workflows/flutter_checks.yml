name: Flutter static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Dart/Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

  native-build-readiness:
    name: Native project scaffolding check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android and iOS build entrypoints
        shell: bash
        run: |
          missing=0
          for path in android/settings.gradle android/gradlew android/gradle/wrapper/gradle-wrapper.properties ios/Podfile ios/Runner.xcodeproj/project.pbxproj; do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Required native build file is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Native build gate is blocked: restore the generated Flutter Android/iOS project scaffolding before attempting release builds."
            exit 1
          fi
          echo "Android and iOS entrypoint files are present."
