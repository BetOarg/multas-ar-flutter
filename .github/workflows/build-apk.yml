name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test and build installable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/multas-ci-validation.jks" \
            -storepass ci-only-pass -keypass ci-only-pass \
            -alias ci-validation -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI Validation Only"
          cat > android/app/key.properties <<EOF
          storeFile=$RUNNER_TEMP/multas-ci-validation.jks
          storePassword=ci-only-pass
          keyAlias=ci-validation
          keyPassword=ci-only-pass
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -n "$AAPT"
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::Release APK unexpectedly declares INTERNET permission."
            exit 1
          fi
          echo "Verified: release APK does not declare android.permission.INTERNET."
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Rename APK with version and run number
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '"' | head -n 1)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/multas-ar-${VERSION}-ci-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/SHA256SUMS.txt dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: multas-ar-apk-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
