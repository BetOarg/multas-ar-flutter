plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.betOarg.multas_ar"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.0.12077973"  // requerido por ONNX Runtime

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Requerido para flutter_local_notifications con timezone
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.betOarg.multas_ar"
        minSdkVersion 26          // Android 8.0+ — target ML Kit
        targetSdkVersion 35       // Google Play requirement 2025
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        // ONNX Runtime — ABI filters
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug  // reemplazar con keystore en producción
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Empaquetar modelos ONNX como assets
    androidResources {
        noCompress "onnx", "bin"
    }
}

flutter {
    source "../.."
}

dependencies {
    // Desugaring para timezone / flutter_local_notifications
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"

    // ONNX Runtime Android
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.18.0"

    // ML Kit (fallback OCR)
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-latin:16.0.1"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
